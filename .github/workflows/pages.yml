name: 发布文献地图

# 只发布 litmap.html 到 Pages。仓库本身是公开的，但站点只从这个工作流
# 上传的那一个文件生成——所以 pages 上只有文献地图，不含 data/ 与 weekly/。
on:
  push:
    branches: [main]
    paths:
      - litmap.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 不要并发部署，后一次等前一次跑完
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 本仓库实测情况：Pages 早就是开着的，但 Source 是 "Deploy from a branch"
      # （legacy 构建）。那个模式下 GitHub 用内置的 "pages build and deployment"
      # 工作流把 main 分支根目录整个发布出去——站点根没有 index.html 所以 / 是 404，
      # 但 /litmap.html 能通，而且 data/ 与 weekly/ 也一起挂在站点上。
      #
      # 必须手动切一次 Source 到 **GitHub Actions**：
      #     Settings → Pages → Build and deployment → Source
      # 两种模式的差别：
      #     Deploy from a branch → 整个仓库当站点，Jekyll 处理，根目录无 index 则 404
      #     GitHub Actions       → 只发布下面 _site 里装的东西，也就是只有文献地图
      #
      # 注意：configure-pages 的 enablement: true **开不了** Pages——开通要 admin
      # 权限，GITHUB_TOKEN 没有。所以这一步只能由仓库所有者手动做，不是配置错误。
      # 站点已存在时 enablement 只是读配置，不会重复调用创建接口。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 组装站点
        run: |
          mkdir -p _site
          # 两份：index.html 给干净的根地址，litmap.html 保住换模式前已在用的地址
          cp litmap.html _site/index.html
          cp litmap.html _site/litmap.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
