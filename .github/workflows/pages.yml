name: 发布文献地图

# 只发布 litmap.html 到 Pages。仓库本身是公开的，但站点只从这个工作流
# 上传的那一个文件生成——所以 pages 上只有文献地图，不含 data/ 与 weekly/。
on:
  push:
    branches: [main]
    paths:
      - litmap.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 不要并发部署，后一次等前一次跑完
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Source 已于 2026-09-23 手动切为 **GitHub Actions**
      # （Settings → Pages → Build and deployment → Source）。
      #
      # 切换前是 "Deploy from a branch"（legacy 构建）：那个模式下 GitHub 用内置的
      # "pages build and deployment" 工作流把 main 分支根目录整个发布出去——站点根
      # 没有 index.html 所以 / 是 404，但 /litmap.html 能通，而且 data/、weekly/、
      # scripts/ 也一起挂在站点上。切到 Actions 后，站点只由下面 _site 里装的东西生成，
      # 也就是只有文献地图这一页。
      #
      # 两个容易踩的点：
      #   1. **切 Source 本身不会触发部署。** 旧站点会一直挂着，直到本工作流跑完一次。
      #      改了 Source 却没看到变化时，先确认跑过一次，再怀疑配置。
      #   2. configure-pages 的 enablement: true **开不了** Pages——开通要 admin 权限，
      #      GITHUB_TOKEN 没有。站点已存在时它只是读配置。这一步只能仓库所有者手动做，
      #      不是配置错误。
      #
      # 另外：Pages 设置页那两张 "GitHub Pages Jekyll" / "Static HTML" 模板卡片
      # **不要点 Configure**，那是给还没有工作流的人用的，会往仓库里塞第二份 workflow。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 组装站点
        run: |
          mkdir -p _site
          # 两份：index.html 给干净的根地址，litmap.html 保住换模式前已在用的地址
          cp litmap.html _site/index.html
          cp litmap.html _site/litmap.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
