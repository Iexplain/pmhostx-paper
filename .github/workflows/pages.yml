name: 发布文献地图

# 只发布 litmap.html 到 Pages。仓库本身是公开的，但站点只从这个工作流
# 上传的那一个文件生成——所以 pages 上只有文献地图，不含 data/ 与 weekly/。
on:
  push:
    branches: [main]
    paths:
      - litmap.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 不要并发部署，后一次等前一次跑完
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 的实测结论：**开不了**。开通 Pages 要 admin 权限，
      # 而 GITHUB_TOKEN 没有（首次运行即失败在 "Resource not accessible by
      # integration"）。GitHub 的设计就是仓库所有者必须手动开一次。
      #
      # 一次性准备：仓库 Settings → Pages → Build and deployment →
      #            Source 选 **GitHub Actions**（不是 "Deploy from a branch"，
      #            后者是 legacy 构建，会让下面的 deploy-pages 报错）。
      # 开完之后这个工作流每次推送自动部署。
      #
      # enablement 保留在此：站点已存在时它只是读配置，不会重复调用创建接口。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 组装站点
        run: |
          mkdir -p _site
          cp litmap.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
